<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeckCare | พักคอ ลดก้ม</title>
  <style>
    :root {
      --red: #c92338;
      --dark: #3b1720;
      --muted: #74666a;
      --line: #efdce0;
      --soft: #fff3f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #fff9fa; color: var(--dark);
      font-family: system-ui, sans-serif; line-height: 1.6; padding: 16px;
    }
    .card {
      background: white; padding: 20px; border: 1px solid var(--line);
      border-radius: 20px; max-width: 600px; margin: 20px auto;
      box-shadow: 0 8px 25px rgba(201,35,56,0.08);
    }
    h1, h2 { color: var(--red); text-align: center; }
    label { display: block; font-weight: bold; margin-top: 14px; }
    input, select {
      width: 100%; padding: 12px; margin-top: 6px;
      border-radius: 10px; border: 1px solid #d9c4c9; font: inherit;
    }
    button {
      width: 100%; margin-top: 18px; padding: 14px;
      background: var(--red); color: white; border: none;
      border-radius: 10px; font-weight: bold; cursor: pointer; font: inherit;
    }
    button.secondary { background: var(--soft); color: var(--red); border: 1px solid var(--line); }
    .hidden { display: none !important; }
    .level-box {
      padding: 20px; border-radius: 14px; text-align: center; margin: 15px 0;
      font-size: 20px; font-weight: bold; border: 2px solid #ddd;
    }
    .camera-container {
      position: relative; background: #111; border-radius: 14px; overflow: hidden; margin-top: 15px;
    }
    canvas { width: 100%; display: block; aspect-ratio: 4/3; object-fit: contain; }
    .timer { text-align: center; font-size: 48px; font-weight: bold; color: var(--red); margin: 10px 0; }
    .notice { padding: 12px; background: var(--soft); border-left: 4px solid var(--red); border-radius: 8px; margin: 12px 0; font-size: 14px; }
  </style>
</head>
<body>

  <!-- หน้าลงชื่อและกรอกคะแนน -->
  <div id="entryCard" class="card">
    <h1>NeckCare</h1>
    <p style="text-align: center;">เว็บแอปช่วยบรรเทาอาการปวดคอจากการก้มมือถือ</p>
    
    <label for="name">ชื่อผู้เข้าร่วม</label>
    <input type="text" id="name" placeholder="กรอกชื่อ-นามสกุล" required>
    
    <label for="number">เลขที่</label>
    <input type="text" id="number" placeholder="กรอกเลขที่" required>
    
    <label for="score">คะแนนประเมิน (0-25)</label>
    <input type="number" id="score" min="0" max="25" placeholder="กรอกคะแนนจากแบบฟอร์ม" required>

    <button id="toActivityBtn">ตรวจสอบระดับและเริ่มกิจกรรม</button>
    <button id="openAdminBtn" class="secondary" style="margin-top: 10px;">เข้าสู่ระบบแอดมิน</button>
  </div>

  <!-- หน้ากิจกรรมและกล้อง -->
  <div id="activityCard" class="card hidden">
    <h2 id="participantTitle"></h2>
    <div id="levelDisplay" class="level-box"></div>
    <p id="activityDesc" class="muted" style="text-align: center;"></p>

    <div class="notice">
      กิจกรรม 3 ท่า ใช้เวลาท่าละ 1 นาที (รวมพักเปลี่ยนท่า เป็นเวลา 5 นาที) กรุณาเปิดกล้องเพื่อบันทึกวิดีโอตรวจสอบการปฏิบัติ
    </div>

    <label class="check" style="display: flex; gap: 10px; align-items: center; margin: 15px 0;">
      <input type="checkbox" id="consentCheck" style="width: auto;">
      <span>ยินยอมให้บันทึกวิดีโอเพื่อตรวจสอบกิจกรรม</span>
    </label>

    <div style="display: flex; gap: 10px;">
      <button id="startCamBtn" class="secondary">เปิดกล้อง</button>
      <button id="switchCamBtn" class="secondary" disabled>สลับกล้อง</button>
      <button id="mirrorBtn" class="secondary">กระจก: เปิด</button>
    </div>

    <label for="filterSelect" style="margin-top: 10px;">ฟิลเตอร์เสริมสวยภาพ</label>
    <select id="filterSelect">
      <option value="none">ปกติ (ธรรมชาติ)</option>
      <option value="bright">สว่างนุ่มนวล</option>
      <option value="warm">โทนอุ่น</option>
    </select>

    <div class="camera-container">
      <canvas id="camCanvas" width="640" height="480"></canvas>
    </div>
    <video id="hiddenVideo" autoplay muted playsinline class="hidden"></video>

    <h3 id="stepTitle" style="text-align: center; margin-top: 15px;">เตรียมตัวให้พร้อม</h3>
    <div id="timerDisplay" class="timer">01:00</div>

    <button id="startActivityBtn" disabled>เริ่มทำกิจกรรมและบันทึกวิดีโอ</button>
    <button id="backToEntryBtn" class="secondary" style="margin-top: 10px;">กลับหน้าแรก</button>
  </div>

  <!-- หน้าเสร็จสิ้น -->
  <div id="finishCard" class="card hidden">
    <h2>ปฏิบัติกิจกรรมเสร็จสิ้น</h2>
    <p id="uploadStatus" style="text-align: center; font-weight: bold;"></p>
    <button id="restartBtn">ทำใหม่อีกครั้ง</button>
  </div>

  <!-- หน้าแอดมิน -->
  <div id="adminCard" class="card hidden">
    <h2>ระบบแอดมิน (ดูวิดีโอย้อนหลัง)</h2>
    <div id="adminLoginBox">
      <label>อีเมลแอดมิน</label>
      <input type="email" id="adminEmail">
      <label>รหัสผ่าน</label>
      <input type="password" id="adminPassword">
      <button id="adminLoginSubmit">เข้าสู่ระบบ</button>
    </div>
    <div id="adminDataBox" class="hidden">
      <button id="loadRecordsBtn">โหลดรายการทั้งหมด</button>
      <div id="recordsList" style="margin-top: 15px;"></div>
    </div>
    <button id="backFromAdminBtn" class="secondary" style="margin-top: 15px;">กลับหน้าแรก</button>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = id => document.getElementById(id);
    let stream = null, mediaRecorder = null, recordedChunks = [];
    let isMirror = true, facingMode = "user";
    let participantData = null;

    function showCard(cardId) {
      ["entryCard", "activityCard", "finishCard", "adminCard"].forEach(id => {
        $(id).classList.toggle("hidden", id !== cardId);
      });
    }

    $("toActivityBtn").onclick = () => {
      const name = $("name").value.trim();
      const number = $("number").value.trim();
      const score = parseInt($("score").value);

      if (!name || !number || isNaN(score) || score < 0 || score > 25) {
        alert("กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง (คะแนน 0-25)");
        return;
      }

      participantData = { name, number, score };
      let levelText = "", bgColor = "#fff", desc = "";

      if (score <= 5) {
        levelText = "ระดับความเจ็บปวด 0";
        bgColor = "#ffffff";
        desc = "ท่าผ่อนคลายเบื้องต้นระดับที่ 1 (เน้นการพักคอและผ่อนคลายกล้ามเนื้อ)";
      } else if (score <= 10) {
        levelText = "ระดับความเจ็บปวด 1-3";
        bgColor = "#dcfce7";
        desc = "ท่าผ่อนคลายระดับที่ 2 (เพิ่มการขยับช่วงคอเบาๆ)";
      } else if (score <= 15) {
        levelText = "ระดับความเจ็บปวด 4-6";
        bgColor = "#fef3b0";
        desc = "ท่าผ่อนคลายระดับที่ 3 (เน้นยืดเหยียดอย่างระมัดระวัง)";
      } else if (score <= 20) {
        levelText = "ระดับความเจ็บปวด 7-9";
        bgColor = "#ffdfbd";
        desc = "ท่าผ่อนคลายระดับที่ 4 (เน้นประคับประคองและลดเกร็ง)";
      } else {
        levelText = "ระดับความเจ็บปวด 10";
        bgColor = "#ffd5dc";
        desc = "ท่าผ่อนคลายระดับสูงสุด (พักผ่อนในท่าที่สบายที่สุด หลีกเลี่ยงการฝืน)";
      }

      $("participantTitle").textContent = `ผู้เข้าร่วม: ${name} (เลขที่ ${number})`;
      $("levelDisplay").style.background = bgColor;
      $("levelDisplay").textContent = `${levelText} (คะแนน ${score})`;
      $("activityDesc").textContent = desc;

      showCard("activityCard");
    };

    async function startCamera() {
      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode, width: 640, height: 480 },
          audio: false
        });
        $("hiddenVideo").srcObject = stream;
        await $("hiddenVideo").play();
        requestAnimationFrame(drawVideo);
        $("switchCamBtn").disabled = false;
        $("startActivityBtn").disabled = false;
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้: " + err.message);
      }
    }

    function drawVideo() {
      const canvas = $("camCanvas");
      const ctx = canvas.getContext("2d");
      const video = $("hiddenVideo");

      if (video.readyState >= 2) {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const filter = $("filterSelect").value;
        ctx.filter = filter === "bright" ? "brightness(1.15) contrast(0.95)" :
                     filter === "warm" ? "sepia(0.2) brightness(1.05)" : "none";

        if (isMirror) {
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
      requestAnimationFrame(drawVideo);
    }

    $("startCamBtn").onclick = () => {
      if (!$("consentCheck").checked) {
        alert("กรุณากดยินยอมการบันทึกวิดีโอก่อนเปิดกล้อง");
        return;
      }
      startCamera();
    };

    $("switchCamBtn").onclick = () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();
    };

    $("mirrorBtn").onclick = () => {
      isMirror = !isMirror;
      $("mirrorBtn").textContent = `กระจก: ${isMirror ? "เปิด" : "ปิด"}`;
    };

    $("startActivityBtn").onclick = async () => {
      $("startActivityBtn").disabled = true;
      
      const { data: session, error } = await db.from("neck_sessions").insert([{
        participant_name: participantData.name,
        participant_number: participantData.number,
        score: participantData.score,
        consent_version: "v1",
        completed: false
      }]).select().single();

      if (error) {
        alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล: " + error.message);
        $("startActivityBtn").disabled = false;
        return;
      }

      const sessionId = session.id;
      recordedChunks = [];
      const canvasStream = $("camCanvas").captureStream(20);
      mediaRecorder = new MediaRecorder(canvasStream, { mimeType: "video/webm" });

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        const blob = new Blob(recordedChunks, { type: "video/webm" });
        const fileName = `${sessionId}.webm`;
        
        $("uploadStatus").textContent = "กำลังอัปโหลดวิดีโอย้อนหลัง...";
        showCard("finishCard");

        const { error: uploadError } = await db.storage.from("neck-videos").upload(fileName, blob);
        
        if (!uploadError) {
          await db.from("neck_sessions").update({ completed: true, video_path: fileName }).eq("id", sessionId);
          $("uploadStatus").textContent = "ปฏิบัติกิจกรรมเสร็จสิ้น และอัปโหลดวิดีโอเรียบร้อยแล้ว!";
        } else {
          $("uploadStatus").textContent = "กิจกรรมเสร็จสิ้น แต่อัปโหลดวิดีโอไม่สำเร็จ: " + uploadError.message;
        }
      };

      mediaRecorder.start();

      let timeLeft = 10; 
      $("stepTitle").textContent = "กำลังทำกิจกรรมท่าที่ 1 (จาก 3 ท่า)";
      
      const timerInterval = setInterval(() => {
        timeLeft--;
        let m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        let s = String(timeLeft % 60).padStart(2, '0');
        $("timerDisplay").textContent = `${m}:${s}`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          mediaRecorder.stop();
          if (stream) stream.getTracks().forEach(t => t.stop());
        }
      }, 1000);
    };

    $("restartBtn").onclick = () => {
      $("score").value = "";
      $("consentCheck").checked = false;
      showCard("entryCard");
    };

    $("openAdminBtn").onclick = () => showCard("adminCard");
    $("backFromAdminBtn").onclick = () => showCard("entryCard");
    $("backToEntryBtn").onclick = () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      showCard("entryCard");
    };

    $("adminLoginSubmit").onclick = async () => {
      const email = $("adminEmail").value;
      const password = $("adminPassword").value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        alert("เข้าสู่ระบบไม่สำเร็จ: " + error.message);
      } else {
        $("adminLoginBox").classList.add("hidden");
        $("adminDataBox").classList.remove("hidden");
      }
    };

    $("loadRecordsBtn").onclick = async () => {
      const { data, error } = await db.from("neck_sessions").select("*").order("created_at", { ascending: false });
      const listDiv = $("recordsList");
      listDiv.innerHTML = "";
      if (error) {
        listDiv.textContent = "โหลดข้อมูลไม่ได้: " + error.message;
        return;
      }
      data.forEach(item => {
        const p = document.createElement("p");
        p.textContent = `${item.participant_name} (เลขที่ ${item.participant_number}) - คะแนน: ${item.score} - ${item.completed ? "เสร็จสิ้น" : "ยังไม่เสร็จ"}`;
        listDiv.appendChild(p);
      });
    };
  </script>
</body>
</html>
